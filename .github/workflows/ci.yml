name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate data records
        run: bun run data:validate

      - name: Check data formatting
        run: bun run data:format --check

      - name: Compile play specs
        run: bun run specs:check

      - name: Build data release (JSON, CSV, SQLite)
        run: bun run data:release --version ci

      - name: Run Vitest Validation Suite
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build the site
        run: bun run build

      - name: Check the built site
        run: bun run site:check
