name: Release data

# Pushing a tag like data-v0.1.0 builds the dataset downloads and attaches them to a DRAFT GitHub release; nothing is
# public until you open the draft on the Releases page, check the files and notes, and press Publish.
# A tag with a suffix, like data-v0.1.0-rc.1, makes a pre-release.
# The tag must match data/VERSION (a suffix like -rc.1 is ignored for the match), so the downloads on the site and the files on
# the release name the same version.
# Run it by hand (Actions tab, "Release data") to build the same files as a downloadable workflow artifact without releasing.
# The packaging steps also run in CI on every push (bun run data:package), so only the last step is new on a tag.
on:
  push:
    tags: ['data-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Name the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if ! [[ "${GITHUB_REF_NAME}" =~ ^data-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} must look like data-v1.2.3 or data-v1.2.3-rc.1."
              exit 1
            fi
            version="${GITHUB_REF_NAME#data-}"
            declared="$(tr -d '[:space:]' < data/VERSION)"
            if [ "${version%%-*}" != "${declared}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match data/VERSION (${declared}). Set data/VERSION to ${version%%-*} in the commit you tag."
              exit 1
            fi
            echo "name=${version}" >> "$GITHUB_OUTPUT"
            if [[ "${version}" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "name=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate data records
        run: bun run data:validate

      - name: Build the downloads
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: bun run data:release --version "$VERSION"

      - name: Package the release files
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          bun run data:package --version "$VERSION"
          cd dist/release-assets
          sha256sum -c SHA256SUMS

      - name: Upload as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: scheme-db-${{ steps.version.outputs.name }}
          path: dist/release-assets/*
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--draft)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "Scheme DB data $VERSION" \
            --notes-file dist/release-notes.md \
            "${flags[@]}" \
            dist/release-assets/*
