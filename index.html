      <section>
        <h2>20 NFL Scheme Families</h2>
        <ul>
          <li><strong>Kyle Shanahan Wide Zone:</strong> Stretch outside zone married to play-action deep overs and naked bootlegs.</li>
          <li><strong>Klint Kubiak Split Zone &amp; Leak:</strong> Heavy 12-personnel split-zone, dagger shots, and Y-leak throwback boots.</li>
          <li><strong>Andy Reid Spread-RPO &amp; Mesh:</strong> West Coast passing with RPO tags, mesh rubs, and shovel options.</li>
          <li><strong>Sean McVay Duo &amp; Play-Action:</strong> Condensed 11-personnel duo vertical double-teams, sail floods, and deep crossers.</li>
          <li><strong>Mike McDaniel Speed Cheat-Motion:</strong> Orbit cheat motion crack toss, speed wheel shots, and wham traps.</li>
          <li><strong>Kevin Stefanski Multi-TE Gap:</strong> 13-personnel pin-and-pull sweeps, PA seam shots, and GT counter lead.</li>
          <li><strong>Shane Steichen QB Mesh RPO:</strong> Dual-threat QB power read, mesh rail wheel, and bubble RPOs.</li>
          <li><strong>Matt LaFleur Illusion of Complexity:</strong> Pony package screen-wheels, cross-country deep posts, and PA dagger digs.</li>
          <li><strong>Nick Sirianni Power RPO:</strong> Heavy gap power duo, slant RPOs, and Brotherly Shove short-yardage.</li>
          <li><strong>Ben Johnson Counter Deception:</strong> Counter trey, throwback flea flickers, and orbit reverse screens.</li>
          <li><strong>Robert Saleh 4-3 Wide-9:</strong> Wide-9 edge rush, gap integrity, and Cover 3 match.</li>
          <li><strong>Mike Macdonald Sim-Pressure &amp; Hybrid:</strong> Double-A mug, amoeba fronts, 4-man creeper pressures, and split-safety disguise.</li>
          <li><strong>Brian Flores Psycho Cover 0 Blitz:</strong> Extreme binary pressure — all-out House blitz vs Drop-8 lurk.</li>
          <li><strong>Vic Fangio Two-High Shell &amp; Quarters:</strong> Two-high pre-snap shell, Cover 6, Cover 8 boundary trap, and Penny front.</li>
          <li><strong>Jesse Minter Amoeba Creeper:</strong> Rotating amoeba sim pressures, peel blitzes, and boundary fire zones.</li>
          <li><strong>DeMeco Ryans Wide-9 Attack:</strong> Aggressive penetrating Wide-9 front with Cover 3 buzz and cross-dog blitzes.</li>
          <li><strong>Chris Shula Match Quarters:</strong> Split-field Cover 6 match and weakside dog blitzes.</li>
          <li><strong>Steve Spagnuolo Exotic Blitz:</strong> Overload fire blitzes, slot corner cats, and robber coverages.</li>
          <li><strong>Dan Quinn Cover 3 Press:</strong> Physical press-bail Cover 3, single-high safety rotation, and 5-man fire zone.</li>
          <li><strong>Todd Bowles Creeper Blitz:</strong> Dual A-gap cross blitz, overload boundary fire, and peel-zone sim pressure.</li>
        </ul>
