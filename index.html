          Catmull-Rom spline trajectory interpolation, 0.0s–1.2s disguise mesh window conflict telemetry,
          and 17 coaching lineage trees spanning 53 coaches.

      <section>
        <h2>45 Football Scheme Families</h2>
        <ul>
          <li><strong>Kyle Shanahan Wide Zone:</strong> Stretch outside zone married to play-action deep overs and naked bootlegs.</li>
          <li><strong>Klint Kubiak Split Zone &amp; Leak:</strong> Heavy 12-personnel split-zone, dagger shots, and Y-leak throwback boots.</li>
          <li><strong>Andy Reid Spread-RPO &amp; Mesh:</strong> West Coast passing with RPO tags, mesh rubs, and shovel options.</li>
          <li><strong>Sean McVay Duo &amp; Play-Action:</strong> Condensed 11-personnel duo vertical double-teams, sail floods, and deep crossers.</li>
          <li><strong>Mike McDaniel Speed Cheat-Motion:</strong> Orbit cheat motion crack toss, speed wheel shots, and wham traps.</li>
          <li><strong>Kevin Stefanski Multi-TE Gap:</strong> 13-personnel pin-and-pull sweeps, PA seam shots, and GT counter lead.</li>
          <li><strong>Shane Steichen QB Mesh RPO:</strong> Dual-threat QB power read, mesh rail wheel, and bubble RPOs.</li>
          <li><strong>Matt LaFleur Illusion of Complexity:</strong> Pony package screen-wheels, cross-country deep posts, and PA dagger digs.</li>
          <li><strong>Nick Sirianni Power RPO:</strong> Heavy gap power duo, slant RPOs, and Brotherly Shove short-yardage.</li>
          <li><strong>Ben Johnson Counter Deception:</strong> Counter trey, throwback flea flickers, and orbit reverse screens.</li>
          <li><strong>Sean Payton Quick Game &amp; Screens:</strong> Slant-flat rhythm, convoy fast screens, tunnel shovels, and jet sweep play-action.</li>
          <li><strong>Greg Roman Power Read &amp; QB Run:</strong> Power read pulls, QB power keepers, pin-and-pull sweeps, and heavy PA shots.</li>
          <li><strong>Kevin O'Connell Boot &amp; Dagger:</strong> Condensed wide-zone stretch, boot floods, and dagger seam-curl shots.</li>
          <li><strong>Liam Coen Wide-Zone RPO:</strong> Box-number glance RPOs, bubble-slant-flat triangles, and crack-toss perimeter attacks.</li>
          <li><strong>Chip Kelly Tempo Spread:</strong> Snap-rate stress with mesh spacing, spot triangles, zone-read draws, and four-verts takeovers.</li>
          <li><strong>Don Coryell Air Coryell (past NFL):</strong> One-back vertical route trees, seam-post strokes, and deep comeback geometry.</li>
          <li><strong>Bill Walsh Classic West Coast Offense (past NFL):</strong> Timed slant-flat rhythm, Sprint Right Option, and curl-flat floods.</li>
          <li><strong>June Jones Run and Shoot (past NFL):</strong> Four-wide read-route conversions — switch verticals, post-wheels, and go-stab adjustments.</li>
          <li><strong>Vince Lombardi T-Formation Power Sweep (past NFL):</strong> Pulling-guard perimeter sweep, fullback blast, and sweep-pass bootlegs.</li>
          <li><strong>Tubby Raymond Delaware Wing-T (past college):</strong> Guard-pull buck sweep, waggle floods, counter crisscross, and trap-gut.</li>
          <li><strong>Chris Ault Pistol Read-Option (past college):</strong> Downhill pistol inside zone reads, power-O reads, and speed options.</li>
          <li><strong>Art Briles Baylor Choice Spread (past college):</strong> Slot choice vertical shots off inside-zone read action.</li>
          <li><strong>Urban Meyer Spread-Option (past college):</strong> Inside-zone reads, inverted veer power reads, and snag triangle spacing.</li>
          <li><strong>Paul Johnson Flexbone Triple Option (college):</strong> Midline triples, rocket toss pitch series, and inside veer geometry.</li>
          <li><strong>Mike Leach Air Raid (college):</strong> Mesh, Y-cross, stick spacing, and shallow distribution from empty looks.</li>
          <li><strong>Robert Saleh 4-3 Wide-9:</strong> Wide-9 edge rush, gap integrity, and Cover 3 match.</li>
          <li><strong>Mike Macdonald Sim-Pressure &amp; Hybrid:</strong> Double-A mug, amoeba fronts, 4-man creeper pressures, and split-safety disguise.</li>
          <li><strong>Brian Flores Psycho Cover 0 Blitz:</strong> Extreme binary pressure — all-out House blitz vs Drop-8 lurk.</li>
          <li><strong>Vic Fangio Two-High Shell &amp; Quarters:</strong> Two-high pre-snap shell, Cover 6, Cover 8 boundary trap, and Penny front.</li>
          <li><strong>Jesse Minter Amoeba Creeper:</strong> Rotating amoeba sim pressures, peel blitzes, and boundary fire zones.</li>
          <li><strong>DeMeco Ryans Wide-9 Attack:</strong> Aggressive penetrating Wide-9 front with Cover 3 buzz and cross-dog blitzes.</li>
          <li><strong>Chris Shula Match Quarters:</strong> Split-field Cover 6 match and weakside dog blitzes.</li>
          <li><strong>Steve Spagnuolo Exotic Blitz:</strong> Overload fire blitzes, slot corner cats, and robber coverages.</li>
          <li><strong>Dan Quinn Cover 3 Press:</strong> Physical press-bail Cover 3, single-high safety rotation, and 5-man fire zone.</li>
          <li><strong>Todd Bowles Creeper Blitz:</strong> Dual A-gap cross blitz, overload boundary fire, and peel-zone sim pressure.</li>
          <li><strong>Buddy Ryan 46 Defense (past NFL):</strong> Eight-man box with zero deep-middle help, mad-dog mug overloads, and E-X-T combos.</li>
          <li><strong>Dick LeBeau Fire Zone Blitz (past NFL):</strong> True five-man pressures with DL drops behind 3-deep/3-under fire zones.</li>
          <li><strong>Tony Dungy Tampa 2 (past NFL):</strong> Middle-of-field-closed Cover 2 with the Mike running the deep hole.</li>
          <li><strong>Tom Landry Flex Defense (past NFL):</strong> Staggered one-yard-off flexed tackles and three-defender point-of-attack convergence.</li>
          <li><strong>Bum Phillips Two-Gap 3-4 (past NFL):</strong> Zero-tech two-gap nose with stand-up edge rusher weapons.</li>
          <li><strong>Jimmy Johnson Speed 4-3 (past NFL):</strong> Undersized penetrating linemen slanting at the snap with man-free pressure.</li>
          <li><strong>Marvin Lewis Cover 2 Man-Under (past NFL):</strong> Two-deep safeties over pure man underneath in the red zone.</li>
          <li><strong>Bill Belichick Okie/Bear Package (NFL):</strong> Zero-nose goal-line geometry, double-A mug threats, and Bear-to-46 stems.</li>
          <li><strong>Dave Aranda Tite Front / Peso (college):</strong> 4i-0-4i B-gap elimination with peso hybrids and simulated pressures.</li>
          <li><strong>Rocky Long 3-3-5 Stack (college):</strong> Stacked odd-front pressure by committee with total pre-snap ambiguity.</li>
        </ul>
